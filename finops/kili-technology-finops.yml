description: >-
  FinOps view of Kili Technology spend. Kili is a subscription / sales-led
  data-labeling platform: a Free evaluation tier, a usage-based Grow plan, and a
  custom Enterprise contract, plus optional per-hour expert annotation services.
  Cost drivers are seats, annotated assets/labels volume, and managed-workforce
  hours rather than per-API-call metering. Specific rates are quoted by sales and
  are not reconciled here.
notes: >-
  Confirm contract structure, seat and asset allowances, and expert-service
  hourly rates with Kili during reconciliation; usage-based Grow pricing is not
  fully published.
