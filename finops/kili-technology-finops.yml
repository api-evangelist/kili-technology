meters:
- name: team_seats
  description: Active team seats with access to the labeling application and API.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - organization
- name: annotated_assets
  description: Assets imported and annotated, the primary volume driver on the Grow plan.
  unit: assets
  aggregation: sum
  dimensions:
  - account
  - project
- name: labels_created
  description: Labels and predictions created across projects.
  unit: labels
  aggregation: sum
  dimensions:
  - account
  - project
- name: expert_service_hours
  description: Hours of in-platform expert annotation services, billed per hour.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - project
principles:
- name: Visibility
  description: Track seats, annotated-asset counts, and labels per project via the GraphQL countProjects / countAssets / countLabels queries.
- name: Allocation
  description: Tag projects and API keys per team/workload; map annotation volume to internal cost centers.
- name: Optimization
  description: Use quality workflows (consensus, honeypot, review issues) to reduce rework; right-size seats and reserve expert-service hours for specialized tasks.
- name: Accountability
  description: Assign project owners; review annotated-asset volume and expert-service hours monthly against the contract or Grow budget.
