aid: kili-technology
url: https://raw.githubusercontent.com/api-evangelist/kili-technology/refs/heads/main/apis.yml
name: Kili Technology
kind: company
description: Kili Technology is a training-data and data-labeling platform for building
  high-quality datasets for machine learning and LLMs. Its labeling application is
  fully programmable through a single GraphQL API (and a Python SDK) covering projects,
  assets, labels, issues, and users at https://cloud.kili-technology.com/api/label/v2/graphql.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- Data Labeling
- Training Data
- Annotation
- GraphQL
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
